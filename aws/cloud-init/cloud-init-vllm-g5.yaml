#cloud-config
# RAG Lab - AWS EC2 Cloud-Init Script with vLLM Support
# Instance Type: g5.2xlarge (NVIDIA A10G Tensor Core GPU - Ampere Architecture)
# OS: Ubuntu 24.04 LTS
# Features: NVIDIA A10G + vLLM + RAG Lab
# Note: Uses public GitHub repository (no authentication required)
# Two-phase deployment: Phase 1 installs drivers and reboots, Phase 2 deploys services

package_update: true
package_upgrade: true

packages:
  - ubuntu-drivers-common
  - curl
  - git
  - unzip
  - jq
  - build-essential
  - ca-certificates
  - gnupg
  - lsb-release
  - python3-pip
  - python3-venv

# Phase 2 script (runs after reboot)
write_files:
  - path: /usr/local/bin/rag-lab-vllm-deploy.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -euo pipefail
      LOG=/var/log/rag-lab-setup.log

      [ -f /var/lib/rag-lab-stage2-complete ] && exit 0

      echo "===== RAG Lab Phase 2 (vLLM Deployment) =====" | tee -a "$LOG"
      date | tee -a "$LOG"

      # Verify GPU is loaded
      echo "Verifying GPU..." | tee -a "$LOG"
      nvidia-smi 2>&1 | tee -a "$LOG" || echo "Warning: nvidia-smi not available" | tee -a "$LOG"

      # Fix home ownership
      chown -R ubuntu:ubuntu /home/ubuntu 2>/dev/null || true

      # Clone repo (public - no token needed)
      if [ ! -d /home/ubuntu/rag_lab ]; then
        echo "Cloning RAG Lab repository..." | tee -a "$LOG"
        sudo -H -u ubuntu bash -c 'cd ~ && git clone https://github.com/sandbreak80/rag_lab.git' 2>&1 | tee -a "$LOG"
        chown -R ubuntu:ubuntu /home/ubuntu/rag_lab
      else
        echo "Repository already exists" | tee -a "$LOG"
      fi

      # Install vLLM (Native - Faster than Docker for A10G)
      echo "===== Installing vLLM for A10G GPU =====" | tee -a "$LOG"
      if [ ! -d /home/ubuntu/vllm-env ]; then
        sudo -H -u ubuntu bash -c 'python3 -m venv /home/ubuntu/vllm-env' 2>&1 | tee -a "$LOG"
        sudo -H -u ubuntu bash -c '/home/ubuntu/vllm-env/bin/pip install --upgrade pip' 2>&1 | tee -a "$LOG"
        sudo -H -u ubuntu bash -c '/home/ubuntu/vllm-env/bin/pip install vllm ray' 2>&1 | tee -a "$LOG"
        echo "vLLM installed successfully" | tee -a "$LOG"
      else
        echo "vLLM environment already exists" | tee -a "$LOG"
      fi

      # Verify vLLM GPU access
      echo "Verifying vLLM GPU access..." | tee -a "$LOG"
      sudo -H -u ubuntu bash -c '/home/ubuntu/vllm-env/bin/python -c "import torch; print(\"CUDA available:\", torch.cuda.is_available()); print(\"GPU:\", torch.cuda.get_device_name(0) if torch.cuda.is_available() else \"None\")"' 2>&1 | tee -a "$LOG"

      # Start Ollama with GPU support (backup LLM)
      echo "===== Starting Ollama with GPU =====" | tee -a "$LOG"
      if ! docker ps -a | grep -q rag-ollama; then
        docker run -d --gpus=all -v ollama:/root/.ollama -p 11434:11434 --name rag-ollama --restart unless-stopped ollama/ollama 2>&1 | tee -a "$LOG"
        sleep 10
        echo "Pulling Ollama models..." | tee -a "$LOG"
        docker exec rag-ollama ollama pull llama3.1:8b 2>&1 | tee -a "$LOG" || echo "Model pull failed, can retry later" | tee -a "$LOG"
        docker exec rag-ollama ollama pull nomic-embed-text 2>&1 | tee -a "$LOG" || echo "Model pull failed, can retry later" | tee -a "$LOG"
      else
        echo "Ollama container already exists" | tee -a "$LOG"
        docker start rag-ollama 2>/dev/null || true
      fi

      # Build and start RAG Lab
      echo "===== Building and Starting RAG Lab =====" | tee -a "$LOG"
      cd /home/ubuntu/rag_lab
      sudo -H -u ubuntu docker compose build 2>&1 | tee -a "$LOG"
      sudo -H -u ubuntu docker compose up -d 2>&1 | tee -a "$LOG"

      # Wait for services
      echo "Waiting for services to start..." | tee -a "$LOG"
      sleep 60

      # Generate deployment info
      echo "" | tee -a "$LOG"
      echo "📊 DEPLOYMENT INFO:" | tee -a "$LOG"
      echo "================================" | tee -a "$LOG"
      PUBLIC_IP=$(curl -s http://169.254.169.254/latest/meta-data/public-ipv4 || echo "unknown")
      echo "Public IP: $PUBLIC_IP" | tee -a "$LOG"
      echo "Frontend: http://$PUBLIC_IP:3000" | tee -a "$LOG"
      echo "API Gateway: http://$PUBLIC_IP:8000" | tee -a "$LOG"
      echo "Ollama API: http://$PUBLIC_IP:11434" | tee -a "$LOG"
      echo "vLLM API: http://$PUBLIC_IP:8001 (if enabled)" | tee -a "$LOG"

      # Final service status
      echo "" | tee -a "$LOG"
      echo "🏥 FINAL SERVICE STATUS:" | tee -a "$LOG"
      echo "================================" | tee -a "$LOG"
      sudo -H -u ubuntu docker compose ps 2>&1 | tee -a "$LOG"

      touch /var/lib/rag-lab-stage2-complete
      echo "" | tee -a "$LOG"
      echo "===== ✅ RAG LAB vLLM DEPLOYMENT COMPLETE =====" | tee -a "$LOG"
      date | tee -a "$LOG"

  - path: /etc/systemd/system/rag-lab-vllm-deploy.service
    permissions: '0644'
    content: |
      [Unit]
      Description=RAG Lab vLLM Deployment (Phase 2)
      After=network-online.target docker.service
      Wants=network-online.target
      ConditionPathExists=!/var/lib/rag-lab-stage2-complete

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/rag-lab-vllm-deploy.sh
      StandardOutput=append:/var/log/rag-lab-setup.log
      StandardError=append:/var/log/rag-lab-setup.log

      [Install]
      WantedBy=multi-user.target

  - path: /home/ubuntu/deployment-info.txt
    permissions: '0644'
    content: |
      ====================================
      RAG Lab Deployment - g5.2xlarge
      ====================================

      Instance Type: g5.2xlarge
      GPU: NVIDIA A10G Tensor Core (24GB VRAM)
      Architecture: Ampere (Supports vLLM)
      vCPUs: 8
      RAM: 32GB
      OS: Ubuntu 24.04 LTS

      Services:
      - Frontend: http://PUBLIC_IP:3000
      - API Gateway: http://PUBLIC_IP:8000
      - Ollama: http://PUBLIC_IP:11434
      - vLLM: http://PUBLIC_IP:8001 (optional)

      LLM Options:
      1. Ollama (Docker) - For smaller models (llama3.1:8b)
      2. vLLM (Native) - For larger models, faster inference

      vLLM Commands:
      # Start vLLM server
      sudo systemctl start vllm

      # Check vLLM status
      sudo systemctl status vllm

      # Test vLLM API (OpenAI-compatible)
      curl http://localhost:8001/v1/models

      Cost Information:
      - Running: ~$1.21/hour (~$29/day, ~$870/month)
      - Stopped: ~$0.65/day (EBS only)
      - Savings when stopped: 98%

      ====================================

  - path: /home/ubuntu/start-vllm.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      # Start vLLM server with custom model

      MODEL=${1:-"/home/ubuntu/models/llama-2-7b-chat"}
      PORT=${2:-8001}

      echo "Starting vLLM server..."
      echo "Model: $MODEL"
      echo "Port: $PORT"

      source /home/ubuntu/vllm-env/bin/activate

      python -m vllm.entrypoints.openai.api_server \
          --model $MODEL \
          --host 0.0.0.0 \
          --port $PORT \
          --tensor-parallel-size 1 \
          --gpu-memory-utilization 0.9

  - path: /home/ubuntu/test-vllm.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      # Test vLLM API

      echo "Testing vLLM API..."

      # Test 1: List models
      echo "1. Listing available models:"
      curl -s http://localhost:8001/v1/models | jq .

      echo ""
      echo "2. Sending test completion request:"
      curl -s http://localhost:8001/v1/completions \
          -H "Content-Type: application/json" \
          -d '{
              "model": "/home/ubuntu/models/llama-2-7b-chat",
              "prompt": "What is the capital of France?",
              "max_tokens": 50,
              "temperature": 0.7
          }' | jq .

  - path: /home/ubuntu/update-rag-lab.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      # Update RAG Lab to latest version

      echo "Updating RAG Lab..."
      cd /home/ubuntu/rag_lab

      docker compose down

      # Using public repo - no token needed
      git remote set-url origin https://github.com/sandbreak80/rag_lab.git
      git pull origin main

      docker compose build
      docker compose up -d

      echo "Update complete!"
      sleep 30
      docker compose ps

# Phase 1: First boot only (install drivers, then reboot)
runcmd:
  - echo "===== RAG Lab Phase 1 (vLLM) =====" | tee /var/log/rag-lab-setup.log
  - date | tee -a /var/log/rag-lab-setup.log

  # Docker installation
  - echo "Installing Docker..." | tee -a /var/log/rag-lab-setup.log
  - mkdir -p /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - usermod -aG docker ubuntu
  - systemctl enable docker
  - systemctl start docker

  # NVIDIA drivers (full package including nvidia-smi)
  - echo "Installing NVIDIA drivers..." | tee -a /var/log/rag-lab-setup.log
  - ubuntu-drivers install --gpgpu 2>&1 | tee -a /var/log/rag-lab-setup.log
  # Install full driver package - check what was installed and install corresponding full package
  - |
    # Check which driver packages are installed (compute libraries)
    if dpkg -l | grep -q "nvidia-compute-utils-580-server"; then
      echo "Installing full driver package: nvidia-driver-580-server" | tee -a /var/log/rag-lab-setup.log
      apt-get install -y nvidia-driver-580-server 2>&1 | tee -a /var/log/rag-lab-setup.log || echo "Driver package install attempted" | tee -a /var/log/rag-lab-setup.log
    elif dpkg -l | grep -q "nvidia-compute-utils-570-server"; then
      echo "Installing full driver package: nvidia-driver-570-server" | tee -a /var/log/rag-lab-setup.log
      apt-get install -y nvidia-driver-570-server 2>&1 | tee -a /var/log/rag-lab-setup.log || echo "Driver package install attempted" | tee -a /var/log/rag-lab-setup.log
    else
      # Fallback: try common driver packages
      echo "No driver detected, trying common packages..." | tee -a /var/log/rag-lab-setup.log
      apt-get install -y nvidia-driver-580-server nvidia-driver-570-server 2>&1 | tee -a /var/log/rag-lab-setup.log || echo "Driver package install attempted" | tee -a /var/log/rag-lab-setup.log
    fi

  # NVIDIA Container Toolkit
  - echo "Installing NVIDIA Container Toolkit..." | tee -a /var/log/rag-lab-setup.log
  - curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey | gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
  - curl -s -L https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list | sed 's#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#g' | tee /etc/apt/sources.list.d/nvidia-container-toolkit.list
  - apt-get update
  - apt-get install -y nvidia-container-toolkit
  - nvidia-ctk runtime configure --runtime=docker
  - systemctl restart docker

  # Enable Phase 2
  - systemctl daemon-reload
  - systemctl enable rag-lab-vllm-deploy.service

  - touch /var/lib/rag-lab-stage1-complete
  - echo "Phase 1 complete, will reboot to activate NVIDIA drivers" | tee -a /var/log/rag-lab-setup.log
  - date | tee -a /var/log/rag-lab-setup.log

# Conditional reboot (CRITICAL: only once)
power_state:
  mode: reboot
  message: "Activating NVIDIA drivers"
  condition: test -f /var/lib/rag-lab-stage1-complete && test ! -f /var/lib/rag-lab-stage2-complete

final_message: "RAG Lab vLLM: Phase 1 complete, rebooting. Phase 2 will deploy services after reboot."
