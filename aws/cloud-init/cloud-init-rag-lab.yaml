#cloud-config
# RAG Lab - AWS EC2 Cloud-Init Script
# Instance Type: g4dn.2xlarge (GPU-enabled)
# OS: Ubuntu 24.04 LTS
# Purpose: Automated deployment with NVIDIA drivers, Docker, and RAG Lab

# System updates and package installation
package_update: true
package_upgrade: true

packages:
  - ubuntu-drivers-common
  - curl
  - git
  - unzip
  - build-essential
  - ca-certificates
  - gnupg
  - lsb-release
  - python3-pip

runcmd:
  # ==========================================
  # NVIDIA GPU DRIVERS
  # ==========================================
  - echo "===== Installing NVIDIA Drivers ====="
  - ubuntu-drivers install --gpgpu
  - nvidia-smi || echo "GPU driver installation pending reboot"

  # ==========================================
  # DOCKER INSTALLATION
  # ==========================================
  - echo "===== Installing Docker ====="
  - mkdir -p /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

  # ==========================================
  # DOCKER POST-INSTALL (ubuntu user)
  # ==========================================
  - echo "===== Configuring Docker for ubuntu user ====="
  - usermod -aG docker ubuntu
  - systemctl enable docker
  - systemctl start docker

  # ==========================================
  # NVIDIA CONTAINER TOOLKIT
  # ==========================================
  - echo "===== Installing NVIDIA Container Toolkit ====="
  - curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey | gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
  - curl -s -L https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list | sed 's#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#g' | tee /etc/apt/sources.list.d/nvidia-container-toolkit.list
  - apt-get update
  - apt-get install -y nvidia-container-toolkit
  - nvidia-ctk runtime configure --runtime=docker
  - systemctl restart docker

  # ==========================================
  # RAG LAB DEPLOYMENT
  # ==========================================
  - echo "===== Cloning RAG Lab Repository ====="
  - cd /home/ubuntu
  - su - ubuntu -c "git clone https://github.com/sandbreak80/rag_lab.git /home/ubuntu/rag_lab"
  - chown -R ubuntu:ubuntu /home/ubuntu/rag_lab

  # ==========================================
  # OLLAMA WITH GPU SUPPORT
  # ==========================================
  - echo "===== Starting Ollama with GPU ====="
  - docker run -d --gpus=all -v ollama:/root/.ollama -p 11434:11434 --name ollama --restart unless-stopped ollama/ollama
  - sleep 10

  # ==========================================
  # PULL OLLAMA MODELS (Required)
  # ==========================================
  - echo "===== Pulling Ollama Models ====="
  - docker exec ollama ollama pull llama3.1:8b
  - docker exec ollama ollama pull nomic-embed-text

  # ==========================================
  # BUILD AND START RAG LAB
  # ==========================================
  - echo "===== Building and Starting RAG Lab ====="
  - cd /home/ubuntu/rag_lab
  - su - ubuntu -c "cd /home/ubuntu/rag_lab && docker compose build"
  - su - ubuntu -c "cd /home/ubuntu/rag_lab && docker compose up -d"

  # ==========================================
  # WAIT FOR SERVICES TO BE HEALTHY
  # ==========================================
  - echo "===== Waiting for services to start ====="
  - sleep 60
  - su - ubuntu -c "cd /home/ubuntu/rag_lab && docker compose ps"

  # ==========================================
  # CREATE DEFAULT USER (Optional)
  # ==========================================
  - echo "===== Creating default admin user ====="
  - |
    sleep 30
    curl -X POST http://localhost:8000/api/auth/register \
      -H "Content-Type: application/json" \
      -d '{"username":"admin","password":"ChangeMe123!","email":"admin@raglab.local"}' || echo "User creation will be available after full startup"

  # ==========================================
  # SYSTEM STATUS
  # ==========================================
  - echo "===== Installation Complete ====="
  - nvidia-smi
  - docker ps
  - echo "RAG Lab is starting up. Allow 5-10 minutes for all services to be ready."
  - echo "Access the application at http://$(curl -s http://169.254.169.254/latest/meta-data/public-ipv4):3000"

# Write deployment info to file
write_files:
  - path: /home/ubuntu/deployment-info.txt
    owner: ubuntu:ubuntu
    permissions: '0644'
    content: |
      ====================================
      RAG Lab Deployment Information
      ====================================

      Instance Type: g4dn.2xlarge
      GPU: NVIDIA T4 (16GB)
      OS: Ubuntu 24.04 LTS

      Services:
      - Frontend: http://PUBLIC_IP:3000
      - API Gateway: http://PUBLIC_IP:8000
      - Ollama: http://PUBLIC_IP:11434

      Default Login (create your own):
      Username: admin
      Password: ChangeMe123!

      Useful Commands:
      cd /home/ubuntu/rag_lab
      docker compose ps              # Check service status
      docker compose logs -f         # View logs
      docker compose restart         # Restart services
      docker compose down            # Stop services
      docker compose up -d           # Start services

      GPU Check:
      nvidia-smi                     # Check GPU status
      docker exec ollama nvidia-smi  # Check GPU in Ollama

      Pull Additional Models:
      docker exec ollama ollama pull llama3.2:3b
      docker exec ollama ollama pull llama3.1:70b
      docker exec ollama ollama pull mistral:7b

      Troubleshooting:
      sudo systemctl status docker
      docker logs <container_name>
      cat /var/log/cloud-init-output.log

      ====================================

  - path: /home/ubuntu/update-rag-lab.sh
    owner: ubuntu:ubuntu
    permissions: '0755'
    content: |
      #!/bin/bash
      # Update RAG Lab to latest version

      echo "Updating RAG Lab..."
      cd /home/ubuntu/rag_lab

      # Stop services
      docker compose down

      # Pull latest code
      git pull origin security

      # Rebuild and restart
      docker compose build
      docker compose up -d

      echo "Update complete! Waiting for services to be healthy..."
      sleep 30
      docker compose ps

# Final message
final_message: |
  ====================================
  RAG Lab Cloud-Init Complete!
  ====================================

  The system has been configured with:
  ✅ NVIDIA GPU drivers
  ✅ Docker with GPU support
  ✅ Ollama with llama3.1:8b and nomic-embed-text
  ✅ RAG Lab (all 15 microservices)

  IMPORTANT: Services may take 5-10 minutes to fully start.

  Access the application:
  Frontend: http://PUBLIC_IP:3000
  API: http://PUBLIC_IP:8000

  View deployment info:
  cat /home/ubuntu/deployment-info.txt

  Check logs:
  tail -f /var/log/cloud-init-output.log

  ====================================

