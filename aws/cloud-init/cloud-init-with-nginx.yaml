#cloud-config
# RAG Lab - AWS EC2 with NGINX Reverse Proxy on Port 80
# Automatically exposes frontend on standard HTTP port 80

package_update: true
package_upgrade: true

packages:
  - ubuntu-drivers-common
  - curl
  - git
  - unzip
  - jq
  - build-essential
  - ca-certificates
  - gnupg
  - lsb-release
  - python3-pip
  - awscli
  - nginx  # Add NGINX

runcmd:
  # ==========================================
  # NVIDIA GPU DRIVERS
  # ==========================================
  - echo "===== Installing NVIDIA Drivers ====="
  - ubuntu-drivers install --gpgpu
  - nvidia-smi || echo "GPU driver installation pending reboot"

  # ==========================================
  # DOCKER INSTALLATION
  # ==========================================
  - echo "===== Installing Docker ====="
  - mkdir -p /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

  # ==========================================
  # DOCKER POST-INSTALL
  # ==========================================
  - echo "===== Configuring Docker ====="
  - usermod -aG docker ubuntu
  - systemctl enable docker
  - systemctl start docker

  # ==========================================
  # NVIDIA CONTAINER TOOLKIT
  # ==========================================
  - echo "===== Installing NVIDIA Container Toolkit ====="
  - curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey | gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
  - curl -s -L https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list | sed 's#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#g' | tee /etc/apt/sources.list.d/nvidia-container-toolkit.list
  - apt-get update
  - apt-get install -y nvidia-container-toolkit
  - nvidia-ctk runtime configure --runtime=docker
  - systemctl restart docker

  # ==========================================
  # RETRIEVE GITHUB TOKEN
  # ==========================================
  - echo "===== Retrieving GitHub credentials ====="
  - |
    REGION=$(curl -s http://169.254.169.254/latest/meta-data/placement/region)
    GITHUB_TOKEN=$(aws secretsmanager get-secret-value \
      --secret-id rag-lab/github-token \
      --region $REGION \
      --query SecretString \
      --output text 2>/dev/null || echo "")
    
    if [ -z "$GITHUB_TOKEN" ]; then
      echo "ERROR: Could not retrieve GitHub token"
      exit 1
    fi
    
    echo "$GITHUB_TOKEN" > /tmp/github_token
    chmod 600 /tmp/github_token

  # ==========================================
  # CLONE GITHUB REPO
  # ==========================================
  - echo "===== Cloning RAG Lab Repository ====="
  - |
    cd /home/ubuntu
    GITHUB_TOKEN=$(cat /tmp/github_token)
    su - ubuntu -c "git clone https://${GITHUB_TOKEN}@github.com/sandbreak80/rag_lab.git /home/ubuntu/rag_lab"
    su - ubuntu -c "cd /home/ubuntu/rag_lab && git remote set-url origin https://github.com/sandbreak80/rag_lab.git"
    rm -f /tmp/github_token
    chown -R ubuntu:ubuntu /home/ubuntu/rag_lab

  # ==========================================
  # OLLAMA
  # ==========================================
  - echo "===== Starting Ollama ====="
  - docker run -d --gpus=all -v ollama:/root/.ollama -p 11434:11434 --name ollama --restart unless-stopped ollama/ollama
  - sleep 10
  - docker exec ollama ollama pull llama3.1:8b
  - docker exec ollama ollama pull nomic-embed-text

  # ==========================================
  # BUILD AND START RAG LAB
  # ==========================================
  - echo "===== Building RAG Lab ====="
  - cd /home/ubuntu/rag_lab
  - su - ubuntu -c "cd /home/ubuntu/rag_lab && docker compose build"
  - su - ubuntu -c "cd /home/ubuntu/rag_lab && docker compose up -d"
  - sleep 60

  # ==========================================
  # CONFIGURE NGINX REVERSE PROXY (Port 80)
  # ==========================================
  - echo "===== Configuring NGINX Reverse Proxy ====="
  - |
    # Create NGINX configuration
    cat > /etc/nginx/sites-available/rag-lab <<'NGINX_EOF'
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        server_tokens off;

        # Logging
        access_log /var/log/nginx/rag-lab-access.log;
        error_log /var/log/nginx/rag-lab-error.log;

        # Large file uploads
        client_max_body_size 100M;

        # Proxy to frontend container (port 3000)
        location / {
            proxy_pass http://localhost:3000;
            proxy_http_version 1.1;
            
            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            
            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            # Timeouts for long LLM requests
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
            proxy_send_timeout 300s;
        }

        # Health check
        location /health {
            proxy_pass http://localhost:3000/health;
            access_log off;
        }
    }
    NGINX_EOF

    # Enable site
    rm -f /etc/nginx/sites-enabled/default
    ln -sf /etc/nginx/sites-available/rag-lab /etc/nginx/sites-enabled/
    
    # Test and start NGINX
    nginx -t
    systemctl enable nginx
    systemctl restart nginx

  # ==========================================
  # STATUS
  # ==========================================
  - echo "===== Installation Complete ====="
  - |
    PUBLIC_IP=$(curl -s http://169.254.169.254/latest/meta-data/public-ipv4)
    echo ""
    echo "======================================"
    echo "RAG Lab is ready!"
    echo "======================================"
    echo ""
    echo "Access at: http://${PUBLIC_IP}"
    echo ""
    echo "Services running:"
    docker ps --format "table {{.Names}}\t{{.Status}}"
    echo ""
    echo "NGINX status:"
    systemctl status nginx --no-pager | head -5
    echo ""
    echo "======================================"

write_files:
  - path: /home/ubuntu/deployment-info.txt
    owner: ubuntu:ubuntu
    permissions: '0644'
    content: |
      ====================================
      RAG Lab Deployment
      ====================================
      
      Access: http://PUBLIC_IP
      
      Port 80 (HTTP) → NGINX → Frontend (Docker port 3000)
      
      Services:
      - Frontend: Internal port 3000 (proxied via NGINX)
      - API Gateway: http://localhost:8000
      - Ollama: http://localhost:11434
      
      NGINX Configuration:
      - Config: /etc/nginx/sites-available/rag-lab
      - Logs: /var/log/nginx/rag-lab-*.log
      - Status: sudo systemctl status nginx
      
      Setup HTTPS (optional):
      1. Point your domain to this server's IP
      2. Run: /home/ubuntu/rag_lab/aws/scripts/setup-letsencrypt.sh yourdomain.com
      
      Useful Commands:
      cd /home/ubuntu/rag_lab
      docker compose ps
      docker compose logs -f
      sudo nginx -t
      sudo systemctl reload nginx
      
      ====================================

  - path: /home/ubuntu/update-rag-lab.sh
    owner: ubuntu:ubuntu
    permissions: '0755'
    content: |
      #!/bin/bash
      echo "Updating RAG Lab..."
      cd /home/ubuntu/rag_lab
      docker compose down
      REGION=$(curl -s http://169.254.169.254/latest/meta-data/placement/region)
      GITHUB_TOKEN=$(aws secretsmanager get-secret-value \
        --secret-id rag-lab/github-token \
        --region $REGION \
        --query SecretString \
        --output text)
      git remote set-url origin https://${GITHUB_TOKEN}@github.com/sandbreak80/rag_lab.git
      git pull origin security
      git remote set-url origin https://github.com/sandbreak80/rag_lab.git
      docker compose build
      docker compose up -d
      sudo systemctl reload nginx
      echo "Update complete!"

final_message: |
  ====================================
  RAG Lab with NGINX Reverse Proxy
  ====================================
  
  ✅ Frontend accessible on port 80 (HTTP)
  ✅ NGINX proxying to Docker containers
  ✅ All services starting up
  
  Access: http://PUBLIC_IP
  
  Wait 5-10 minutes for all services to be ready.
  
  ====================================

