#cloud-config
# RAG Lab - AWS EC2 Cloud-Init Script (v4 - Robust Docker Readiness)
# Instance Type: g4dn.2xlarge (GPU-enabled)
# OS: Ubuntu 24.04 LTS
# Purpose: Automated deployment with NVIDIA drivers, Docker, and RAG Lab
# Features:
# - Two-stage deployment with native cloud-init reboots
# - Robust Docker readiness checks before use
# - Installs NVIDIA drivers, Docker, NVIDIA Container Toolkit
# - Clones RAG Lab repository (security branch)
# - Starts Ollama with GPU support
# - Pulls ALL required and optional Ollama models
# - Builds and starts RAG Lab microservices
# - Creates default admin user

# System updates and package installation
package_update: true
package_upgrade: true

packages:
  - ubuntu-drivers-common
  - curl
  - git
  - unzip
  - build-essential
  - ca-certificates
  - gnupg
  - lsb-release
  - python3-pip

# runcmd runs only on FIRST boot
runcmd:
  # ==========================================
  # STAGE 1: Install Docker + NVIDIA Drivers
  # ==========================================
  - echo "===== RAG Lab Stage 1 (First Boot) =====" | tee -a /var/log/rag-lab-setup.log
  - date | tee -a /var/log/rag-lab-setup.log

  # Install Docker
  - echo "Installing Docker..." | tee -a /var/log/rag-lab-setup.log
  - mkdir -p /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

  # Configure Docker
  - usermod -aG docker ubuntu
  - systemctl enable docker
  - systemctl start docker

  # Install NVIDIA drivers
  - echo "Installing NVIDIA drivers..." | tee -a /var/log/rag-lab-setup.log
  - ubuntu-drivers install --gpgpu 2>&1 | tee -a /var/log/rag-lab-setup.log

  # Install NVIDIA Container Toolkit
  - echo "Installing NVIDIA Container Toolkit..." | tee -a /var/log/rag-lab-setup.log
  - curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey | gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
  - curl -s -L https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list | sed 's#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#g' | tee /etc/apt/sources.list.d/nvidia-container-toolkit.list
  - apt-get update
  - apt-get install -y nvidia-container-toolkit
  - nvidia-ctk runtime configure --runtime=docker
  - systemctl restart docker

  # Mark stage 1 complete
  - touch /var/lib/rag-lab-stage1-complete
  - echo "Stage 1 complete, rebooting..." | tee -a /var/log/rag-lab-setup.log
  - date | tee -a /var/log/rag-lab-setup.log

# bootcmd runs on EVERY boot (Stage 2 runs after reboot)
bootcmd:
  - |
    # Check if Stage 1 is complete and Stage 2 hasn't run yet
    if [ -f /var/lib/rag-lab-stage1-complete ] && [ ! -f /var/lib/rag-lab-stage2-complete ]; then
      echo "===== RAG Lab Stage 2 (After Reboot) =====" | tee -a /var/log/rag-lab-setup.log
      date | tee -a /var/log/rag-lab-setup.log

      # Wait for Docker to be fully ready
      echo "Waiting for Docker daemon..." | tee -a /var/log/rag-lab-setup.log
      DOCKER_READY=0
      for i in {1..30}; do
        if docker info >/dev/null 2>&1; then
          DOCKER_READY=1
          echo "Docker is ready!" | tee -a /var/log/rag-lab-setup.log
          break
        fi
        echo "Waiting for Docker... ($i/30)" | tee -a /var/log/rag-lab-setup.log
        sleep 5
      done

      if [ $DOCKER_READY -eq 0 ]; then
        echo "ERROR: Docker failed to start!" | tee -a /var/log/rag-lab-setup.log
        exit 1
      fi

      # Verify GPU
      echo "Verifying GPU..." | tee -a /var/log/rag-lab-setup.log
      nvidia-smi | tee -a /var/log/rag-lab-setup.log
      echo "GPU verified!" | tee -a /var/log/rag-lab-setup.log

      # Clone RAG Lab repository
      if [ ! -d /home/ubuntu/rag_lab ]; then
        echo "Cloning RAG Lab repository..." | tee -a /var/log/rag-lab-setup.log
        su - ubuntu -c "git clone https://github.com/sandbreak80/rag_lab.git /home/ubuntu/rag_lab" 2>&1 | tee -a /var/log/rag-lab-setup.log
        chown -R ubuntu:ubuntu /home/ubuntu/rag_lab
        su - ubuntu -c "cd /home/ubuntu/rag_lab && git checkout security" 2>&1 | tee -a /var/log/rag-lab-setup.log
      fi

      # Start Ollama with GPU
      echo "Starting Ollama..." | tee -a /var/log/rag-lab-setup.log
      docker run -d --gpus=all -v ollama:/root/.ollama -p 11434:11434 --name ollama --restart unless-stopped ollama/ollama 2>&1 | tee -a /var/log/rag-lab-setup.log

      # Wait for Ollama to be ready
      echo "Waiting for Ollama API..." | tee -a /var/log/rag-lab-setup.log
      for i in {1..20}; do
        if curl -s http://localhost:11434/api/tags >/dev/null 2>&1; then
          echo "Ollama API is ready!" | tee -a /var/log/rag-lab-setup.log
          break
        fi
        echo "Waiting for Ollama... ($i/20)" | tee -a /var/log/rag-lab-setup.log
        sleep 3
      done

      # Pull required models
      echo "Pulling required models..." | tee -a /var/log/rag-lab-setup.log
      docker exec ollama ollama pull llama3.1:8b 2>&1 | tee -a /var/log/rag-lab-setup.log
      docker exec ollama ollama pull nomic-embed-text 2>&1 | tee -a /var/log/rag-lab-setup.log

      # Pull optional models (all of them, non-interactive)
      echo "Pulling optional models..." | tee -a /var/log/rag-lab-setup.log
      docker exec ollama ollama pull llama3.2:1b 2>&1 | tee -a /var/log/rag-lab-setup.log &
      docker exec ollama ollama pull llama3.2:3b 2>&1 | tee -a /var/log/rag-lab-setup.log &
      docker exec ollama ollama pull gemma2:2b 2>&1 | tee -a /var/log/rag-lab-setup.log &
      docker exec ollama ollama pull gemma2:9b 2>&1 | tee -a /var/log/rag-lab-setup.log &
      docker exec ollama ollama pull mistral:7b 2>&1 | tee -a /var/log/rag-lab-setup.log &
      docker exec ollama ollama pull qwen2.5:14b 2>&1 | tee -a /var/log/rag-lab-setup.log &
      docker exec ollama ollama pull mxbai-embed-large 2>&1 | tee -a /var/log/rag-lab-setup.log &
      docker exec ollama ollama pull all-minilm 2>&1 | tee -a /var/log/rag-lab-setup.log &

      # Wait for all background model pulls to complete
      echo "Waiting for all model pulls to complete (this may take 10-15 minutes)..." | tee -a /var/log/rag-lab-setup.log
      wait
      echo "All models pulled!" | tee -a /var/log/rag-lab-setup.log

      # Build RAG Lab
      echo "Building RAG Lab..." | tee -a /var/log/rag-lab-setup.log
      su - ubuntu -c "cd /home/ubuntu/rag_lab && docker compose build" 2>&1 | tee -a /var/log/rag-lab-setup.log

      # Start RAG Lab
      echo "Starting RAG Lab..." | tee -a /var/log/rag-lab-setup.log
      su - ubuntu -c "cd /home/ubuntu/rag_lab && docker compose up -d" 2>&1 | tee -a /var/log/rag-lab-setup.log

      # Wait for services to be healthy
      echo "Waiting for services..." | tee -a /var/log/rag-lab-setup.log
      sleep 60
      su - ubuntu -c "cd /home/ubuntu/rag_lab && docker compose ps" 2>&1 | tee -a /var/log/rag-lab-setup.log

      # Create default admin user
      echo "Creating admin user..." | tee -a /var/log/rag-lab-setup.log
      sleep 30
      curl -s -X POST http://localhost:8000/api/auth/register \
        -H "Content-Type: application/json" \
        -d '{"username":"admin","password":"ChangeMe123!","email":"admin@raglab.local"}' >> /var/log/rag-lab-setup.log 2>&1 || true

      # Mark stage 2 complete
      touch /var/lib/rag-lab-stage2-complete
      echo "Stage 2 complete!" | tee -a /var/log/rag-lab-setup.log
      date | tee -a /var/log/rag-lab-setup.log

      # Display status
      PUBLIC_IP=$(curl -s http://169.254.169.254/latest/meta-data/public-ipv4)
      echo "========================================" | tee -a /var/log/rag-lab-setup.log
      echo "RAG Lab Ready!" | tee -a /var/log/rag-lab-setup.log
      echo "Frontend: http://$PUBLIC_IP:3000" | tee -a /var/log/rag-lab-setup.log
      echo "API: http://$PUBLIC_IP:8000" | tee -a /var/log/rag-lab-setup.log
      echo "========================================" | tee -a /var/log/rag-lab-setup.log
    fi

# Conditional reboot after Stage 1
power_state:
  delay: now
  mode: reboot
  message: "Cloud-init Stage 1 complete, rebooting for NVIDIA driver activation."
  condition: "test -f /var/lib/rag-lab-stage1-complete && ! test -f /var/lib/rag-lab-stage2-complete"

# Write deployment info
write_files:
  - path: /home/ubuntu/deployment-info.txt
    owner: ubuntu:ubuntu
    permissions: '0644'
    content: |
      ====================================
      RAG Lab Deployment Information
      ====================================

      Instance Type: g4dn.2xlarge
      GPU: NVIDIA T4 (16GB)
      OS: Ubuntu 24.04 LTS

      Services:
      - Frontend: http://PUBLIC_IP:3000
      - API Gateway: http://PUBLIC_IP:8000
      - Ollama: http://PUBLIC_IP:11434

      Default Login (create your own):
      Username: admin
      Password: ChangeMe123!

      Models Installed:
      Required:
        - llama3.1:8b (Chat/LLM)
        - nomic-embed-text (Embeddings)

      Optional:
        - llama3.2:1b, llama3.2:3b (Small models)
        - gemma2:2b, gemma2:9b (Google models)
        - mistral:7b (Fast alternative)
        - qwen2.5:14b (Best quality for 16GB)
        - mxbai-embed-large, all-minilm (Embedding alternatives)

      Useful Commands:
      cd /home/ubuntu/rag_lab
      docker compose ps              # Check service status
      docker compose logs -f         # View logs
      docker compose restart         # Restart services
      docker compose down            # Stop services
      docker compose up -d           # Start services
      docker exec ollama ollama list # List models

      GPU Check:
      nvidia-smi                     # Check GPU status
      docker exec ollama nvidia-smi  # Check GPU in Ollama

      Troubleshooting:
      sudo systemctl status docker
      docker logs <container_name>
      cat /var/log/rag-lab-setup.log # Unified cloud-init log

      ====================================

  - path: /home/ubuntu/update-rag-lab.sh
    owner: ubuntu:ubuntu
    permissions: '0755'
    content: |
      #!/bin/bash
      # Update RAG Lab to latest version

      echo "Updating RAG Lab..."
      cd /home/ubuntu/rag_lab

      # Stop services
      docker compose down

      # Pull latest code
      git pull origin security

      # Rebuild and restart
      docker compose build
      docker compose up -d

      echo "Update complete! Waiting for services to be healthy..."
      sleep 30
      docker compose ps

# Final message
final_message: |
  ====================================
  RAG Lab Cloud-Init Complete!
  ====================================

  The system has been configured with:
  ✅ NVIDIA GPU drivers
  ✅ Docker with GPU support
  ✅ Ollama with ALL models
  ✅ RAG Lab (all 15 microservices)

  IMPORTANT: Services may take 5-10 minutes to fully start.

  Access the application:
  Frontend: http://PUBLIC_IP:3000
  API: http://PUBLIC_IP:8000

  View deployment info:
  cat /home/ubuntu/deployment-info.txt

  Check logs:
  tail -f /var/log/rag-lab-setup.log

  ====================================

