#cloud-config
# RAG Lab - AWS EC2 Cloud-Init Script (Private GitHub Repo)
# Instance Type: g4dn.2xlarge (GPU-enabled)
# OS: Ubuntu 24.04 LTS
# Security: Uses AWS Secrets Manager for GitHub token

# System updates and package installation
package_update: true
package_upgrade: true

packages:
  - ubuntu-drivers-common
  - curl
  - git
  - unzip
  - jq
  - build-essential
  - ca-certificates
  - gnupg
  - lsb-release
  - python3-pip
  - awscli

runcmd:
  # ==========================================
  # NVIDIA GPU DRIVERS
  # ==========================================
  - echo "===== Installing NVIDIA Drivers ====="
  - ubuntu-drivers install --gpgpu
  - nvidia-smi || echo "GPU driver installation pending reboot"

  # ==========================================
  # DOCKER INSTALLATION
  # ==========================================
  - echo "===== Installing Docker ====="
  - mkdir -p /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

  # ==========================================
  # DOCKER POST-INSTALL
  # ==========================================
  - echo "===== Configuring Docker ====="
  - usermod -aG docker ubuntu
  - systemctl enable docker
  - systemctl start docker

  # ==========================================
  # NVIDIA CONTAINER TOOLKIT
  # ==========================================
  - echo "===== Installing NVIDIA Container Toolkit ====="
  - curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey | gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
  - curl -s -L https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list | sed 's#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#g' | tee /etc/apt/sources.list.d/nvidia-container-toolkit.list
  - apt-get update
  - apt-get install -y nvidia-container-toolkit
  - nvidia-ctk runtime configure --runtime=docker
  - systemctl restart docker

  # ==========================================
  # RETRIEVE GITHUB TOKEN FROM SECRETS MANAGER
  # ==========================================
  - echo "===== Retrieving GitHub credentials from AWS Secrets Manager ====="
  - |
    REGION=$(curl -s http://169.254.169.254/latest/meta-data/placement/region)
    GITHUB_TOKEN=$(aws secretsmanager get-secret-value \
      --secret-id rag-lab/github-token \
      --region $REGION \
      --query SecretString \
      --output text 2>/dev/null || echo "")

    if [ -z "$GITHUB_TOKEN" ]; then
      echo "ERROR: Could not retrieve GitHub token from Secrets Manager"
      echo "Please create secret 'rag-lab/github-token' with your GitHub PAT"
      exit 1
    fi

    # Store for use by ubuntu user
    echo "$GITHUB_TOKEN" > /tmp/github_token
    chmod 600 /tmp/github_token

  # ==========================================
  # CLONE PRIVATE GITHUB REPO
  # ==========================================
  - echo "===== Cloning Private RAG Lab Repository ====="
  - |
    cd /home/ubuntu
    GITHUB_TOKEN=$(cat /tmp/github_token)

    # Clone using token authentication (works for private repos)
    su - ubuntu -c "git clone https://${GITHUB_TOKEN}@github.com/sandbreak80/rag_lab.git /home/ubuntu/rag_lab"

    # Remove token from git config for security
    su - ubuntu -c "cd /home/ubuntu/rag_lab && git remote set-url origin https://github.com/sandbreak80/rag_lab.git"

    # Clean up token
    rm -f /tmp/github_token

    chown -R ubuntu:ubuntu /home/ubuntu/rag_lab
    echo "Repository cloned successfully"

  # ==========================================
  # OLLAMA WITH GPU SUPPORT
  # ==========================================
  - echo "===== Starting Ollama with GPU ====="
  - docker run -d --gpus=all -v ollama:/root/.ollama -p 11434:11434 --name ollama --restart unless-stopped ollama/ollama
  - sleep 10

  # ==========================================
  # PULL OLLAMA MODELS
  # ==========================================
  - echo "===== Pulling Ollama Models ====="
  - docker exec ollama ollama pull llama3.1:8b
  - docker exec ollama ollama pull nomic-embed-text

  # ==========================================
  # BUILD AND START RAG LAB
  # ==========================================
  - echo "===== Building and Starting RAG Lab ====="
  - cd /home/ubuntu/rag_lab
  - su - ubuntu -c "cd /home/ubuntu/rag_lab && docker compose build"
  - su - ubuntu -c "cd /home/ubuntu/rag_lab && docker compose up -d"

  # ==========================================
  # WAIT FOR SERVICES
  # ==========================================
  - echo "===== Waiting for services to start ====="
  - sleep 60
  - su - ubuntu -c "cd /home/ubuntu/rag_lab && docker compose ps"

  # ==========================================
  # SYSTEM STATUS
  # ==========================================
  - echo "===== Installation Complete ====="
  - nvidia-smi
  - docker ps
  - echo "RAG Lab is starting up. Allow 5-10 minutes for all services to be ready."
  - PUBLIC_IP=$(curl -s http://169.254.169.254/latest/meta-data/public-ipv4)
  - echo "Access the application at http://${PUBLIC_IP}:3000"

write_files:
  - path: /home/ubuntu/deployment-info.txt
    owner: ubuntu:ubuntu
    permissions: '0644'
    content: |
      ====================================
      RAG Lab Deployment Information
      ====================================

      Instance Type: g4dn.2xlarge
      GPU: NVIDIA T4 (16GB)
      OS: Ubuntu 24.04 LTS
      GitHub: Private repository (token-authenticated)

      Services:
      - Frontend: http://PUBLIC_IP:3000
      - API Gateway: http://PUBLIC_IP:8000
      - Ollama: http://PUBLIC_IP:11434

      Access Methods:
      1. AWS Session Manager (Recommended - No SSH key needed):
         aws ssm start-session --target INSTANCE_ID

      2. SSH (if security group allows):
         ssh -i your-key.pem ubuntu@PUBLIC_IP

      Useful Commands:
      cd /home/ubuntu/rag_lab
      docker compose ps              # Check service status
      docker compose logs -f         # View logs
      docker compose restart         # Restart services

      Update to Latest:
      /home/ubuntu/update-rag-lab.sh

      ====================================

  - path: /home/ubuntu/update-rag-lab.sh
    owner: ubuntu:ubuntu
    permissions: '0755'
    content: |
      #!/bin/bash
      # Update RAG Lab to latest version (Private Repo)

      echo "Updating RAG Lab..."
      cd /home/ubuntu/rag_lab

      # Stop services
      docker compose down

      # Get GitHub token from Secrets Manager
      REGION=$(curl -s http://169.254.169.254/latest/meta-data/placement/region)
      GITHUB_TOKEN=$(aws secretsmanager get-secret-value \
        --secret-id rag-lab/github-token \
        --region $REGION \
        --query SecretString \
        --output text)

      if [ -z "$GITHUB_TOKEN" ]; then
        echo "ERROR: Could not retrieve GitHub token"
        exit 1
      fi

      # Temporarily set token for pull
      git remote set-url origin https://${GITHUB_TOKEN}@github.com/sandbreak80/rag_lab.git
      git pull origin security

      # Remove token from config
      git remote set-url origin https://github.com/sandbreak80/rag_lab.git

      # Rebuild and restart
      docker compose build
      docker compose up -d

      echo "Update complete!"
      sleep 30
      docker compose ps

final_message: |
  ====================================
  RAG Lab Cloud-Init Complete!
  ====================================

  Private GitHub repository cloned securely.
  All services starting up (5-10 minutes).

  Access via AWS Session Manager (no SSH needed):
  aws ssm start-session --target INSTANCE_ID

  ====================================

