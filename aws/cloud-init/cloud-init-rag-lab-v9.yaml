#cloud-config
# RAG Lab - AWS EC2 Cloud-Init (v9 - FINAL)
# Combines best of v3 (conditional reboot) + v7 (systemd ordering)

package_update: true
package_upgrade: true

packages:
  - ubuntu-drivers-common
  - curl
  - git
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

# Create Phase 2 script
write_files:
  - path: /usr/local/bin/rag-lab-deploy.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -euo pipefail
      LOG=/var/log/rag-lab-setup.log

      [ -f /var/lib/rag-lab-stage2-complete ] && exit 0

      echo "===== RAG Lab Phase 2 =====" | tee -a "$LOG"
      date | tee -a "$LOG"

      # GPU check (optional)
      nvidia-smi 2>&1 | tee -a "$LOG" || true

      # Fix home ownership
      chown ubuntu:ubuntu /home/ubuntu

      # Clone repo
      if [ ! -d /home/ubuntu/rag_lab ]; then
        sudo -H -u ubuntu bash -c 'cd ~ && git clone https://github.com/sandbreak80/rag_lab.git && cd rag_lab && git checkout security' 2>&1 | tee -a "$LOG"
      fi

      # Build & start
      cd /home/ubuntu/rag_lab
      sudo -H -u ubuntu docker compose build 2>&1 | tee -a "$LOG"
      sudo -H -u ubuntu docker compose up -d 2>&1 | tee -a "$LOG"

      # Wait for Ollama
      sleep 30
      for i in {1..30}; do
        docker exec rag-ollama ollama list >/dev/null 2>&1 && break
        sleep 5
      done

      # Pull models using the project's model list
      echo "===== Pulling Ollama Models =====" | tee -a "$LOG"
      
      # Required models (from scripts/pull-ollama-models.sh)
      CHAT_MODEL="llama3.1:8b"
      EMBEDDING_MODEL="nomic-embed-text"
      
      echo "Pulling required models..." | tee -a "$LOG"
      docker exec rag-ollama ollama pull "$CHAT_MODEL" 2>&1 | tee -a "$LOG"
      docker exec rag-ollama ollama pull "$EMBEDDING_MODEL" 2>&1 | tee -a "$LOG"
      
      # Optional models (from scripts/pull-ollama-models.sh) - in background
      echo "Pulling optional models in background..." | tee -a "$LOG"
      (
        OPTIONAL_MODELS=(
          "llama3.2:1b"
          "llama3.2:3b"
          "gemma2:2b"
          "gemma2:9b"
          "mistral:7b"
          "qwen2.5:14b"
          "mxbai-embed-large"
          "all-minilm"
        )
        for model in "${OPTIONAL_MODELS[@]}"; do
          echo "Pulling $model..." | tee -a "$LOG"
          docker exec rag-ollama ollama pull "$model" 2>&1 | tee -a "$LOG" || echo "Warning: Failed to pull $model" | tee -a "$LOG"
        done
        echo "All optional models pulled!" | tee -a "$LOG"
      ) &

      sleep 60
      sudo -H -u ubuntu docker compose ps 2>&1 | tee -a "$LOG"

      touch /var/lib/rag-lab-stage2-complete
      echo "===== Complete =====" | tee -a "$LOG"
      date | tee -a "$LOG"

  - path: /etc/systemd/system/rag-lab-deploy.service
    permissions: '0644'
    content: |
      [Unit]
      Description=RAG Lab Deployment
      After=network-online.target docker.service
      Wants=network-online.target
      ConditionPathExists=!/var/lib/rag-lab-stage2-complete

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/rag-lab-deploy.sh
      StandardOutput=append:/var/log/rag-lab-setup.log
      StandardError=append:/var/log/rag-lab-setup.log

      [Install]
      WantedBy=multi-user.target

# Phase 1: First boot only
runcmd:
  - echo "===== RAG Lab Phase 1 =====" | tee /var/log/rag-lab-setup.log
  - date | tee -a /var/log/rag-lab-setup.log

  # Docker repo
  - mkdir -p /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  - echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - usermod -aG docker ubuntu
  - systemctl enable docker
  - systemctl start docker

  # NVIDIA
  - ubuntu-drivers install --gpgpu 2>&1 | tee -a /var/log/rag-lab-setup.log
  - curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey | gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
  - curl -s -L https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list | sed 's#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#g' | tee /etc/apt/sources.list.d/nvidia-container-toolkit.list
  - apt-get update
  - apt-get install -y nvidia-container-toolkit
  - nvidia-ctk runtime configure --runtime=docker
  - systemctl restart docker

  # Enable Phase 2
  - systemctl daemon-reload
  - systemctl enable rag-lab-deploy.service

  - touch /var/lib/rag-lab-stage1-complete
  - echo "Phase 1 done, will reboot" | tee -a /var/log/rag-lab-setup.log
  - date | tee -a /var/log/rag-lab-setup.log

# Conditional reboot (CRITICAL: only once)
power_state:
  mode: reboot
  message: "Activating NVIDIA drivers"
  condition: test -f /var/lib/rag-lab-stage1-complete && test ! -f /var/lib/rag-lab-stage2-complete

final_message: "RAG Lab v9: Phase 1 complete, rebooting. Phase 2 via systemd after reboot."

