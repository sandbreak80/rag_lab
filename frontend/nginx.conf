# Enhanced Nginx Configuration for Production Security
# Fast Track Phase 7 - Week 9 Day 6-7
# (Server block only - rate limiting zones must be in http block)

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ============================================================
    # SECURITY HEADERS (Enhanced)
    # ============================================================

    # Prevent clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # XSS protection
    add_header X-XSS-Protection "1; mode=block" always;

    # Referrer policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions policy (restrict browser features)
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Content Security Policy (CSP)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' http://localhost:* http://api-gateway:8000;" always;

    # HSTS (HTTP Strict Transport Security) - uncomment for HTTPS
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Server information disclosure prevention
    server_tokens off;

    # ============================================================
    # COMPRESSION (Performance + Reduce bandwidth)
    # ============================================================

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # ============================================================
    # API PROXY (RAG API v1 with OpenTelemetry)
    # ============================================================

    # OLD API endpoints (gpu_status, models, stats, etc) -> api-gateway:8000
    location ~ ^/api/(gpu_status|models|stats|presets|version|services)$ {
        # Proxy to OLD api-gateway for backward compatibility
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api-gateway:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # NEW API v1 (RAG pipeline with observability) -> rag-api-v1:8080
    location /api/ {
        # Strip /api prefix and proxy to RAG API v1
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://rag-api-v1:8080;
        proxy_http_version 1.1;

        # Headers for WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # OpenTelemetry tracing headers
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate $http_tracestate;

        # Security: Add request ID for tracing
        proxy_set_header X-Request-ID $request_id;

        # Performance
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;

        # Timeouts tuned for LLM RAG latency (75s)
        proxy_read_timeout 75s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 75s;

        # Error handling
        proxy_intercept_errors on;
        error_page 502 503 504 /50x.html;
    }

    # ============================================================
    # HEALTH CHECK PROXY (RAG API v1)
    # ============================================================

    location ~ ^/(live|ready|health)$ {
        # No rate limiting for health checks
        access_log off;

        proxy_pass http://rag-api-v1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Quick timeout
        proxy_read_timeout 5s;
        proxy_connect_timeout 5s;
    }

    # ============================================================
    # METRICS ENDPOINT (RAG API v1)
    # ============================================================

    location /metrics {
        # Restrict access (only from internal network in production)
        # allow 10.0.0.0/8;
        # allow 172.16.0.0/12;
        # allow 192.168.0.0/16;
        # deny all;

        proxy_pass http://rag-api-v1:8080/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ============================================================
    # FRONTEND ROUTES (React SPA)
    # ============================================================

    location / {
        # Rate limiting handled by nginx defaults

        # Serve index.html for all routes (SPA routing)
        try_files $uri $uri/ /index.html;

        # Security headers (redundant but explicit)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ============================================================
    # STATIC ASSETS (Aggressive caching)
    # ============================================================

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        # Long-term caching for static assets
        expires 1y;
        add_header Cache-Control "public, immutable";

        # Security headers for static files
        add_header X-Content-Type-Options "nosniff" always;

        # Enable gzip
        gzip_static on;

        # Access logs not needed for static assets
        access_log off;
    }

    # ============================================================
    # INDEX.HTML (No caching - always fresh)
    # ============================================================

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ============================================================
    # SECURITY: Block common attack patterns
    # ============================================================

    # Block access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block access to backup files
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ============================================================
    # ERROR PAGES
    # ============================================================

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
