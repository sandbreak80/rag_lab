# Map OTel tracing headers
map $http_traceparent $traceparent { default $http_traceparent; }
map $http_tracestate  $tracestate  { default $http_tracestate; }
map $request_id       $xrequestid  { default $request_id; }

# Resolver for dynamic DNS (Docker)
resolver 127.0.0.11 valid=30s;

# Custom log format with trace correlation
log_format trace '$remote_addr - $remote_user [$time_local] '
                 '"$request" $status $body_bytes_sent "$http_referer" '
                 '"$http_user_agent" '
                 'traceparent="$http_traceparent" '
                 'request_id="$request_id" '
                 'upstream_response_time=$upstream_response_time '
                 'request_time=$request_time';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Use trace-aware logging
    access_log /var/log/nginx/access.log trace;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Static assets with caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Health endpoints passthrough to API
    location ~ ^/(live|ready|health)$ {
        proxy_pass http://rag-api-v1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header traceparent $traceparent;
        proxy_set_header tracestate $tracestate;
        proxy_set_header X-Request-Id $xrequestid;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # Frontend traces to OTel Collector (MUST come before /api/v1/)
    location /api/v1/traces {
        rewrite ^/api/v1/traces$ /v1/traces break;
        proxy_pass http://otel-collector:4318;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Content-Type application/json;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        add_header Cache-Control "no-store" always;
    }

    # NEW RAG API v1 (with observability) - strip /api prefix
    location /api/v1/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://rag-api-v1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header traceparent $traceparent;
        proxy_set_header tracestate $tracestate;
        proxy_set_header X-Request-Id $xrequestid;
        proxy_http_version 1.1;
        proxy_read_timeout 75s;
        proxy_connect_timeout 5s;

        # File upload support (50MB max)
        client_max_body_size 50M;
        proxy_request_buffering off;

        # No caching for API responses
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # OLD API Gateway (stats, KG, research-agent, etc.) - keep /api prefix
    location /api/ {
        proxy_pass http://api-gateway:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 75s;
        proxy_connect_timeout 5s;

        # File upload support (50MB max)
        client_max_body_size 50M;
        proxy_request_buffering off;

        # No caching for API responses
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Prometheus proxy (metrics and queries) - optional service
    location /prom/ {
        set $prom_backend http://prometheus:9090;
        proxy_pass $prom_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @prometheus_unavailable;
    }

    # Grafana proxy (dashboards) - optional service
    location /graf/ {
        set $graf_backend http://grafana:3000;
        # Strip /graf prefix and pass to Grafana root
        rewrite ^/graf/(.*) /$1 break;
        rewrite ^/graf$ / break;
        proxy_pass $graf_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /graf;
        proxy_set_header X-Frame-Options "SAMEORIGIN";
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
        proxy_intercept_errors on;
        # Disable redirect rewriting to prevent loops
        # Grafana handles its own redirects based on GF_SERVER_ROOT_URL
        # We just need to pass through the redirects as-is
        proxy_redirect off;
        error_page 502 503 504 = @grafana_unavailable;
    }

    # Fallback for unavailable monitoring services
    location @prometheus_unavailable {
        return 503 '{"error": "Prometheus not available"}';
        add_header Content-Type application/json;
    }

    location @grafana_unavailable {
        return 503 '{"error": "Grafana not available"}';
        add_header Content-Type application/json;
    }

    # SPA fallback - serve index.html for all other routes (MUST BE LAST)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
