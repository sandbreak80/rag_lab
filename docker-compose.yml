# Enterprise Agentic AI Platform with Advanced RAG
# Production Docker Compose Configuration
# Version: 3.0 - Consolidated & Cleaned

version: '3.8'

networks:
  rag-network:
    driver: bridge

volumes:
  # Core data persistence
  chromadb-data:          # Vector embeddings
  bm25-indices:           # BM25 keyword search indices
  knowledge-graph:        # Knowledge graph relationships
  uploads:                # Uploaded documents
  metrics-data:           # Performance metrics database
  security-models:        # Security ML models
  ollama-models:          # Ollama model storage
  auth-data:              # Authentication database
  redis-data:             # Redis cache and rate limit data
  research-agent-data:    # Research agent database and cache
  prometheus-data:        # Prometheus time-series database
  grafana-data:           # Grafana dashboards and settings

services:
  # ============================================================================
  # OLLAMA - LLM Service (Integrated)
  # ============================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: rag-ollama
    networks:
      - rag-network
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    restart: unless-stopped
    # GPU support - ENABLED by default for Ubuntu/NVIDIA. COMMENT OUT for Mac/CPU-only
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # vLLM - High-Performance LLM Serving (OpenAI-compatible API)
  # ============================================================================
  # NOTE: Disabled for now - Tesla T4 (compute 7.5) has compatibility issues with vLLM v0.11.0
  # Requires GPU with compute capability >= 8.0 for full feature support (Flash Attention 2)
  # NVIDIA A4000 (compute 8.6) would be fully compatible
  # Uncomment below when hardware is upgraded:
  #
  # vllm:
  #   build:
  #     context: ./services/vllm
  #     dockerfile: Dockerfile
  #   container_name: rag-vllm
  #   networks:
  #     - rag-network
  #   ports:
  #     - "8100:8000"  # OpenAI-compatible API
  #   volumes:
  #     - ollama-models:/root/.cache/huggingface
  #   environment:
  #     - HF_HOME=/root/.cache/huggingface
  #   command: >
  #     --model hugging-quants/Meta-Llama-3.1-8B-Instruct-AWQ-INT4
  #     --quantization awq
  #     --host 0.0.0.0
  #     --port 8000
  #     --max-model-len 8192
  #     --gpu-memory-utilization 0.85
  #     --enable-prefix-caching
  #     --max-num-seqs 16
  #   restart: unless-stopped
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
  #     interval: 30s
  #     timeout: 10s
  #     start_period: 180s
  #     retries: 3

  # ============================================================================
  # CORE RAG SERVICES
  # ============================================================================

  # Vector Database Service (ChromaDB)
  vector-db:
    image: python:3.11-slim
    container_name: rag-vector-db
    networks:
      - rag-network
    ports:
      - "8005:8005"
    volumes:
      - chromadb-data:/chroma/chroma
      - ./services/vector-db/app:/app
      - ./services/common:/workspace/services/common
    working_dir: /app
    env_file:
      - config.env
    environment:
      - SERVICE_NAME=vector-db
      - SERVICE_PORT=8005
      - COLLECTION_NAME=markdown_vault
      - CHROMA_DB_PATH=/chroma/chroma
      - PYTHONPATH=/workspace
      - PYTHONUNBUFFERED=1
    command: bash -c "pip install -q chromadb flask flask-cors requests prometheus-client && python -u service.py"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Embedding Service
  embedding-service:
    image: python:3.11-slim
    container_name: rag-embedding-service
    networks:
      - rag-network
    ports:
      - "8006:8006"
    volumes:
      - ./services/embedding/app:/app
      - ./services/common:/workspace/services/common
    working_dir: /app
    env_file:
      - config.env
    environment:
      - SERVICE_NAME=embedding-service
      - SERVICE_PORT=8006
      - OLLAMA_BASE_URL=http://ollama:11434
      - PYTHONPATH=/workspace
      - PYTHONUNBUFFERED=1
    command: bash -c "pip install -q flask flask-cors requests && python -u service.py"
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Search Service
  search-service:
    image: python:3.11-slim
    container_name: rag-search-service
    networks:
      - rag-network
    ports:
      - "8002:8002"
    volumes:
      - ./services/search/app:/app
      - ./services/common:/workspace/services/common
      - ./src:/workspace/src
      - ./VERSION:/workspace/VERSION:ro
      - bm25-indices:/indices
      - uploads:/uploads
    working_dir: /app
    env_file:
      - config.env
    environment:
      - SERVICE_NAME=search-service
      - SERVICE_PORT=8002
      - PYTHONPATH=/workspace
      - PYTHONUNBUFFERED=1
    command: bash -c "pip install -q flask flask-cors requests rank-bm25 && python -u service.py"
    depends_on:
      - vector-db
      - embedding-service
      - knowledge-graph
      - reranker
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Chat Service
  chat-service:
    image: python:3.11-slim
    container_name: rag-chat-service
    networks:
      - rag-network
    ports:
      - "8003:8003"
    volumes:
      - ./services/chat/app:/app
      - ./services/common:/workspace/services/common
      - ./VERSION:/workspace/VERSION:ro
    working_dir: /app
    env_file:
      - config.env
    environment:
      - SERVICE_NAME=chat-service
      - SERVICE_PORT=8003
      - SEARCH_SERVICE_URL=http://search-service:8002
      - LLM_SERVICE_URL=http://ollama:11434
      - CHAT_MODEL=llama3.1:8b
      - PYTHONPATH=/workspace
    command: bash -c "pip install -q flask flask-cors requests && python -u service.py"
    depends_on:
      - search-service
      - ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # DOCUMENT PROCESSING SERVICES
  # ============================================================================

  # Docling Service (PDF Processing)
  docling-service:
    image: python:3.11-slim
    container_name: rag-docling-service
    networks:
      - rag-network
    ports:
      - "8004:8004"
    volumes:
      - ./services/docling/app:/app
      - ./services/common:/workspace/services/common
      - uploads:/uploads
    working_dir: /app
    env_file:
      - config.env
    environment:
      - SERVICE_NAME=docling-service
      - SERVICE_PORT=8004
      - PYTHONPATH=/workspace
    command: bash -c "apt-get update -qq && apt-get install -y -qq poppler-utils tesseract-ocr && pip install -q flask flask-cors requests docling && python -u service.py"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Ingest Service (Document Ingestion)
  ingest-service:
    image: python:3.11-slim
    container_name: rag-ingest-service
    networks:
      - rag-network
    ports:
      - "8001:8001"
    volumes:
      - ./services/ingest/app:/app
      - ./services/common:/workspace/services/common
      - ./src:/workspace/src
      - uploads:/uploads
      - bm25-indices:/indices
      - knowledge-graph:/kg-data
    working_dir: /app
    env_file:
      - config.env
    environment:
      - SERVICE_NAME=ingest-service
      - SERVICE_PORT=8001
      - DOCLING_SERVICE_URL=http://docling-service:8004
      - EMBEDDING_SERVICE_URL=http://embedding-service:8006
      - VECTOR_DB_URL=http://vector-db:8005
      - PYTHONPATH=/workspace
      - UPLOAD_FOLDER=/uploads
    command: bash -c "pip install -q flask flask-cors requests chromadb ollama pyyaml && python -u service.py"
    depends_on:
      - docling-service
      - embedding-service
      - vector-db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # ADVANCED RAG SERVICES
  # ============================================================================

  # Knowledge Graph Service
  knowledge-graph:
    image: python:3.11-slim
    container_name: rag-knowledge-graph
    networks:
      - rag-network
    ports:
      - "8007:8007"
    volumes:
      - ./services/knowledge-graph/app:/app
      - ./services/common:/workspace/services/common
      - ./src:/workspace/src
      - knowledge-graph:/kg-data
      - bm25-indices:/indices
    working_dir: /app
    env_file:
      - config.env
    environment:
      - SERVICE_NAME=knowledge-graph
      - SERVICE_PORT=8007
      - VECTOR_DB_URL=http://vector-db:8005
      - KNOWLEDGE_GRAPH_PATH=/kg-data/knowledge_graph.pkl
      - PYTHONPATH=/workspace
    command: bash -c "pip install -q flask flask-cors requests networkx chromadb scikit-learn numpy prometheus-client && python -u service.py"
    depends_on:
      - vector-db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8007/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Re-ranking Service
  reranker:
    image: python:3.11-slim
    container_name: rag-reranker
    networks:
      - rag-network
    ports:
      - "8008:8008"
    volumes:
      - ./services/reranker/app:/app
      - ./services/common:/workspace/services/common
      - ./src:/workspace/src
    working_dir: /app
    env_file:
      - config.env
    environment:
      - SERVICE_NAME=reranker-service
      - SERVICE_PORT=8008
      - OLLAMA_BASE_URL=http://ollama:11434
      - CHAT_MODEL=llama3.1:8b
      - PYTHONPATH=/workspace
    command: bash -c "pip install -q flask flask-cors requests && python -u service.py"
    depends_on:
      - ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # WEB SEARCH SERVICES
  # ============================================================================

  # SearXNG Web Search Engine
  searxng:
    image: searxng/searxng:latest
    container_name: rag-searxng
    networks:
      - rag-network
    ports:
      - "8080:8080"
    volumes:
      - ./config/searxng:/etc/searxng:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Web Search Service (SearXNG Wrapper)
  web-search:
    image: python:3.11-slim
    container_name: rag-web-search
    networks:
      - rag-network
    ports:
      - "8009:8009"
    volumes:
      - ./services/web-search/app:/app
      - ./services/common:/workspace/services/common
    working_dir: /app
    env_file:
      - config.env
    environment:
      - SERVICE_NAME=web-search
      - SERVICE_PORT=8009
      - SEARXNG_URL=http://searxng:8080
      - PYTHONPATH=/workspace
    command: bash -c "pip install -q flask flask-cors requests prometheus-client && python -u service.py"
    depends_on:
      - searxng
      - ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8009/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # MONITORING & METRICS
  # ============================================================================

  # Metrics Storage Service
  metrics-store:
    image: python:3.11-slim
    container_name: rag-metrics-store
    networks:
      - rag-network
    ports:
      - "8011:8011"
    volumes:
      - metrics-data:/data/metrics
      - ./services/metrics-store/app:/app
      - ./services/common:/workspace/services/common
      - /var/run/docker.sock:/var/run/docker.sock:ro
    working_dir: /app
    env_file:
      - config.env
    environment:
      - SERVICE_NAME=metrics-store
      - SERVICE_PORT=8011
      - METRICS_DB_PATH=/data/metrics/metrics.db
      - PYTHONPATH=/workspace
    command: bash -c "apt-get update -qq && apt-get install -y -qq docker.io && pip install -q flask flask-cors psutil && python -u service.py"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8011/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # SECURITY SERVICES (Enterprise LLM Security)
  # ============================================================================

  # Security Guardrails Service (Port 8013)
  security-guardrails:
    image: python:3.11-slim
    container_name: rag-security-guardrails
    networks:
      - rag-network
    ports:
      - "8013:8013"
    volumes:
      - ./services/security-guardrails/app:/app
      - ./services/security-guardrails/requirements.txt:/requirements.txt
      - ./services/security-guardrails/download_models.sh:/download_models.sh
      - ./services/common:/workspace/services/common
      - ./config:/workspace/config
      - security-models:/models
    working_dir: /app
    env_file:
      - config.env
    environment:
      - SERVICE_NAME=security-guardrails
      - SERVICE_PORT=8013
      - MODEL_CACHE_DIR=/models
      - HF_HOME=/models/huggingface
      - TRANSFORMERS_CACHE=/models/huggingface
      - PYTHONPATH=/workspace
    command: bash -c "apt-get update -qq && apt-get install -y -qq curl && pip install -q -r /requirements.txt && chmod +x /download_models.sh && /download_models.sh && python -u service.py"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8013/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Prompt Enhancement Service (Port 8012)
  prompt-enhancement:
    image: python:3.11-slim
    container_name: rag-prompt-enhancement
    networks:
      - rag-network
    ports:
      - "8012:8012"
    volumes:
      - ./services/prompt-enhancement/app:/app
      - ./services/prompt-enhancement/requirements.txt:/requirements.txt
      - ./services/common:/workspace/services/common
      - ./config:/workspace/config
      - ./templates:/workspace/templates
    working_dir: /app
    env_file:
      - config.env
    environment:
      - SERVICE_NAME=prompt-enhancement
      - SERVICE_PORT=8012
      - OLLAMA_BASE_URL=http://ollama:11434
      - PROMPT_CLASSIFIER_URL=http://prompt-classifier:8017
      - PYTHONPATH=/workspace
    command: bash -c "apt-get update -qq && apt-get install -y -qq curl && pip install -q -r /requirements.txt && python -u service.py"
    depends_on:
      - ollama
      - prompt-classifier
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8012/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis (for rate limiting and caching)
  redis:
    image: redis:7-alpine
    container_name: rag-redis
    networks:
      - rag-network
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Authentication Service (Port 8014)
  auth-service:
    image: python:3.11-slim
    container_name: rag-auth-service
    networks:
      - rag-network
    ports:
      - "8014:8014"
    volumes:
      - ./services/auth-service/app:/app
      - ./services/auth-service/requirements.txt:/requirements.txt
      - ./services/common:/workspace/services/common
      - ./config:/workspace/config
      - auth-data:/data
    working_dir: /app
    env_file:
      - config.env
    environment:
      - SERVICE_NAME=auth-service
      - SERVICE_PORT=8014
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-this-in-production}
      - DB_PATH=/data/auth.db
      - PYTHONPATH=/workspace
    command: bash -c "apt-get update -qq && apt-get install -y -qq curl && pip install -q -r /requirements.txt && python -u service.py"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8014/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Research Agent (Port 8015) - Autonomous AI Research Discovery
  research-agent:
    image: python:3.11-slim
    container_name: rag-research-agent
    networks:
      - rag-network
    ports:
      - "8015:8015"
    volumes:
      - ./services/research-agent/app:/app
      - ./services/research-agent/requirements.txt:/requirements.txt
      - ./services/common:/workspace/services/common
      - ./config:/workspace/config
      - research-agent-data:/data
    working_dir: /app
    env_file:
      - config.env
    environment:
      - SERVICE_NAME=research-agent
      - SERVICE_PORT=8015
      - INGEST_SERVICE_URL=http://ingest-service:8001
      - DOCLING_SERVICE_URL=http://docling-service:8004
      - DB_PATH=/data/research_agent.db
      - PYTHONPATH=/workspace
      # PDF Processing Options
      - USE_DOCLING_FOR_PDFS=false  # Set to 'true' to process full PDFs (slower but more complete)
      - MAX_PDF_SIZE_MB=10  # Skip PDFs larger than this
    command: bash -c "apt-get update -qq && apt-get install -y -qq curl && pip install -q -r /requirements.txt && python -u service.py"
    depends_on:
      - ingest-service
      - docling-service
    restart: unless-stopped

  # Prompt Classifier (Port 8017) - Intelligent Query Categorization
  prompt-classifier:
    image: python:3.11-slim
    container_name: rag-prompt-classifier
    networks:
      - rag-network
    ports:
      - "8017:8017"
    volumes:
      - ./services/prompt-classifier/app:/app
      - ./services/prompt-classifier/requirements.txt:/requirements.txt
      - ./services/common:/workspace/services/common
    working_dir: /app
    env_file:
      - config.env
    environment:
      - SERVICE_NAME=prompt-classifier
      - SERVICE_PORT=8017
      - PYTHONPATH=/workspace
    command: bash -c "pip install -q -r /requirements.txt && python -u service.py"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8017/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Model Router (Port 8018) - Intelligent Model Selection
  model-router:
    image: python:3.11-slim
    container_name: rag-model-router
    networks:
      - rag-network
    ports:
      - "8018:8018"
    volumes:
      - ./services/model-router/app:/app
      - ./services/model-router/requirements.txt:/requirements.txt
      - ./services/common:/workspace/services/common
    working_dir: /app
    env_file:
      - config.env
    environment:
      - SERVICE_NAME=model-router
      - SERVICE_PORT=8018
      - OLLAMA_URL=http://ollama:11434
      - PROMPT_CLASSIFIER_URL=http://prompt-classifier:8017
      - PYTHONPATH=/workspace
    command: bash -c "apt-get update -qq && apt-get install -y -qq curl && pip install -q -r /requirements.txt && python -u service.py"
    depends_on:
      - ollama
      - prompt-classifier
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8018/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Query Decomposer - Breaks complex queries into simpler sub-queries
  query-decomposer:
    build:
      context: ./services/query-decomposer
      dockerfile: Dockerfile
    container_name: rag-query-decomposer
    networks:
      - rag-network
    ports:
      - "8019:8019"
    volumes:
      - ./services/common:/workspace/services/common
    env_file:
      - config.env
    environment:
      - SERVICE_NAME=query-decomposer
      - SERVICE_PORT=8019
      - OLLAMA_BASE_URL=http://ollama:11434
      - DECOMPOSER_MODEL=llama3.1:8b
      - PYTHONPATH=/workspace
    depends_on:
      - ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8019/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Self-RAG - Retrieval with self-reflection and quality assessment
  self-rag:
    build:
      context: ./services/self-rag
      dockerfile: Dockerfile
    container_name: rag-self-rag
    networks:
      - rag-network
    ports:
      - "8020:8020"
    volumes:
      - ./services/common:/workspace/services/common
    env_file:
      - config.env
    environment:
      - SERVICE_NAME=self-rag
      - SERVICE_PORT=8020
      - OLLAMA_URL=http://ollama:11434
      - SEARCH_SERVICE_URL=http://search-service:8003
      - PYTHONPATH=/workspace
    depends_on:
      - ollama
      - search-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8020/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # API & FRONTEND
  # ============================================================================

  # API Gateway
  api-gateway:
    image: python:3.11-slim
    container_name: rag-api-gateway
    networks:
      - rag-network
    ports:
      - "8000:8000"
    volumes:
      - ./services/api-gateway/app:/app
      - ./services/api-gateway/requirements.txt:/workspace/services/api-gateway/requirements.txt:ro
      - ./services/common:/workspace/services/common
      - ./config:/workspace/config
      - ./VERSION:/workspace/VERSION:ro
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /app
    env_file:
      - config.env
    environment:
      - SERVICE_NAME=api-gateway
      - SERVICE_PORT=8000
      - OLLAMA_BASE_URL=http://ollama:11434
      - SEARCH_SERVICE_URL=http://search-service:8002
      - CHAT_SERVICE_URL=http://chat-service:8003
      - VECTOR_DB_URL=http://vector-db:8005
      - EMBEDDING_SERVICE_URL=http://embedding-service:8006
      - SECURITY_GUARDRAILS_URL=http://security-guardrails:8013
      - PROMPT_ENHANCEMENT_URL=http://prompt-enhancement:8012
      - AUTH_SERVICE_URL=http://auth-service:8014
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/workspace
    command: bash -c "apt-get update -qq && apt-get install -y -qq docker.io && pip install -q -r /workspace/services/api-gateway/requirements.txt && python -u service.py"
    depends_on:
      - search-service
      - chat-service
      - vector-db
      - security-guardrails
      - prompt-enhancement
      - auth-service
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # RAG API v1 - New observability contract (replaces old api-gateway on port 8000)
  rag-api-v1:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    image: rag-api-v1:latest
    container_name: rag-api-v1
    networks:
      - rag-network
    expose:
      - "8080"  # Internal only - accessed via Nginx
    environment:
      # Feature flags
      RAG_ENABLE_OBS: "0"           # Turn ON after acceptance passes
      RAG_USE_MOCK_LLM: "1"
      RAG_USE_MOCK_VECTOR: "1"
      RAG_USE_MOCK_WEB: "1"
      RAG_CONTRACT_VERSION: "1.0.0"
      RAG_FRESHNESS_HOURS: "48"
      RAG_TOPN: "8"
      RAG_AB_TEST: "0"

      # OTel wiring (works even when RAG_ENABLE_OBS=0)
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
      OTEL_RESOURCE_ATTRIBUTES: "service.name=rag-api-v1,service.version=1.0.0,service.namespace=rag-lab,env=dev"
      OTEL_TRACES_EXPORTER: "otlp"
      OTEL_METRICS_EXPORTER: "none"
      OTEL_LOGS_EXPORTER: "none"

      # Service URLs (for real adapters when mocks disabled)
      VECTOR_DB_URL: "http://vector-db:8005"
      SEARCH_SERVICE_URL: "http://search-service:8002"
      OLLAMA_URL: "http://ollama:11434"

      # Prometheus
      METRICS_PORT: "9309"

      # AuthZ
      RAG_PERMS_TTL_SECONDS: "60"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/ready"]
      interval: 10s
      timeout: 2s
      retries: 12
      start_period: 30s
    # TEMP: Commenting out OTel dependency until collector config is fixed
    # depends_on:
    #   otel-collector:
    #     condition: service_healthy
    restart: unless-stopped

  # React Frontend (Production Build with Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rag-frontend
    networks:
      - rag-network
    ports:
      - "3000:80"
    environment:
      - NEXT_PUBLIC_RAG_API=/api
    depends_on:
      - rag-api-v1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # PLAYWRIGHT - E2E Testing
  # ============================================================================

  playwright:
    image: mcr.microsoft.com/playwright:v1.40.0-jammy
    container_name: rag-playwright
    networks:
      - rag-network
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules  # Prevent overwriting
    environment:
      - BASE_URL=http://rag-frontend:80
      - CI=true
    command: >
      sh -c "
        npm install --legacy-peer-deps &&
        npx playwright install --with-deps &&
        npx playwright test
      "
    depends_on:
      - frontend
      - rag-api-v1
    profiles:
      - testing  # Only run with: docker compose --profile testing up

  # ============================================================================
  # MONITORING & OBSERVABILITY - Prometheus + Grafana + OpenTelemetry Stack
  # ============================================================================

  # OpenTelemetry Collector - Traces & Metrics Collection
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: rag-otel-collector
    networks:
      - rag-network
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "8889:8889"   # Prometheus metrics exporter
    volumes:
      - ./config/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    command: ["--config=/etc/otel-collector-config.yaml"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:13133/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Prometheus - Time Series Database & Metrics Collector
  prometheus:
    image: prom/prometheus:latest
    container_name: rag-prometheus
    networks:
      - rag-network
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Grafana - Monitoring Dashboards & Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: rag-grafana
    networks:
      - rag-network
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_SECURITY_COOKIE_SAMESITE=none
      - GF_SECURITY_COOKIE_SECURE=false
    depends_on:
      - prometheus
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # cAdvisor - Container Metrics Collector
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: rag-cadvisor
    networks:
      - rag-network
    ports:
      - "9080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    restart: unless-stopped
    command:
      - '--housekeeping_interval=10s'
      - '--docker_only=true'
      - '--disable_metrics=disk,network,tcp,udp,percpu,sched,process'

  # Docker Health Check Exporter - Exposes container health status
  health-exporter:
    image: python:3.11-slim
    container_name: rag-health-exporter
    networks:
      - rag-network
    ports:
      - "9099:9099"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./services/health-exporter/app:/app
    working_dir: /app
    environment:
      - SERVICE_NAME=health-exporter
      - SERVICE_PORT=9099
    command: bash -c "pip install -q docker prometheus-client && python -u service.py"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9099/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3

  # NVIDIA DCGM Exporter - GPU Metrics (Only for NVIDIA GPU systems)
  # To enable: docker compose --profile gpu up -d
  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:3.1.8-3.1.5-ubuntu20.04
    container_name: rag-dcgm-exporter
    profiles: ["gpu"]  # Optional: only start with --profile gpu
    networks:
      - rag-network
    ports:
      - "9400:9400"
    environment:
      - DCGM_EXPORTER_LISTEN=:9400
      - DCGM_EXPORTER_KUBERNETES=false
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN

  # Node Exporter - System Metrics (CPU, Memory, Disk, Network)
  node-exporter:
    image: prom/node-exporter:latest
    container_name: rag-node-exporter
    networks:
      - rag-network
    ports:
      - "9100:9100"
    command:
      - '--path.rootfs=/host'
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    restart: unless-stopped

  # ============================================================================
  # TESTING (Optional - for development)
  # ============================================================================

  # Playwright Testing Service
  playwright-tests:
    image: mcr.microsoft.com/playwright/python:v1.55.0-jammy
    container_name: rag-playwright-tests
    networks:
      - rag-network
    volumes:
      - ./tests:/tests
      - ./test-results:/test-results
      - ./screenshots:/screenshots
    working_dir: /tests
    environment:
      - BASE_URL=http://frontend:80
      - PYTHONUNBUFFERED=1
    command: bash -c "pip install -q pytest pytest-playwright && python -m pytest test_ui_playwright.py -v -s --tb=short"
    depends_on:
      - frontend
      - api-gateway
    profiles:
      - testing

  # Playwright E2E Tests (TypeScript) - Phase B/C Validation
  e2e:
    image: mcr.microsoft.com/playwright:v1.48.0-jammy
    container_name: rag-e2e-tests
    networks:
      - rag-network
    working_dir: /workspace/tests/e2e
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - >
        npm install &&
        npx playwright install --with-deps &&
        npx playwright test
    environment:
      BASE_URL: http://frontend:3000
      CI: "true"
    volumes:
      - ./:/workspace
    depends_on:
      - frontend
      - rag-api-v1
    profiles:
      - testing
