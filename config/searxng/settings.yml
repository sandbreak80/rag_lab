use_default_settings: true

server:
  secret_key: "educational_rag_lab_secret_key_change_in_production"
  bind_address: "0.0.0.0:8080"
  limiter: true  # Enable rate limiting
  
search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  formats:
    - html
    - json

# Enhanced engine configuration for better results
engines:
  # General Search Engines
  - name: google
    engine: google
    shortcut: go
    timeout: 10.0
    disabled: false
    weight: 1.5  # Boost Google results
    
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    timeout: 10.0
    disabled: false
    weight: 1.2
    
  - name: bing
    engine: bing
    shortcut: bi
    timeout: 10.0
    disabled: false
    weight: 1.0
    
  # Knowledge & Academic Sources
  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    timeout: 10.0
    disabled: false
    weight: 1.3  # Boost educational content
    
  - name: arxiv
    engine: arxiv
    shortcut: arx
    timeout: 10.0
    disabled: false
    weight: 1.4  # Boost academic papers
    categories: science
    
  # Technical Resources
  - name: stackoverflow
    engine: stackoverflow
    shortcut: so
    timeout: 10.0
    disabled: false
    weight: 1.2
    categories: it
    
  - name: github
    engine: github
    shortcut: gh
    timeout: 10.0
    disabled: false
    weight: 1.1
    categories: it
    
  # News & Current Events
  - name: google news
    engine: google_news
    shortcut: gn
    timeout: 10.0
    disabled: false
    weight: 1.0
    
  - name: reddit
    engine: reddit
    shortcut: re
    timeout: 10.0
    disabled: false
    weight: 0.8

ui:
  static_use_hash: true
  infinite_scroll: false

# Optimized outgoing request settings
outgoing:
  request_timeout: 10.0
  max_request_timeout: 20.0  # Increased for slow sources
  pool_connections: 100
  pool_maxsize: 20
  enable_http2: true
  
# Result caching for performance
redis:
  url: false  # Disabled for now (can enable with Redis container)
  
# Rate limiting to avoid IP bans
limiter:
  enabled: true
  
# Hostname plugin for better source attribution
hostname_replace:
  '(.*\.)?youtube\.com$': 'YouTube'
  '(.*\.)?github\.com$': 'GitHub'
  '(.*\.)?stackoverflow\.com$': 'StackOverflow'

