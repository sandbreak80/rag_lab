version: '3.8'

# Microservices RAG Lab - Production Configuration
# All configuration loaded from config.env

networks:
  rag-network:
    driver: bridge

volumes:
  # Core data persistence
  chromadb-data:     # Vector embeddings
  bm25-indices:      # BM25 keyword search indices
  knowledge-graph:   # Knowledge graph relationships
  uploads:           # Uploaded documents (persistent)
  metrics-data:      # Performance metrics database

  # Optional (if using local Ollama in Docker)
  # ollama-models:

services:
  # Note: Using local Ollama at host.docker.internal:11434
  # To use Ollama in Docker, uncomment the ollama service below

  # Vector Database Service (ChromaDB)
  vector-db:
    image: python:3.11-slim
    container_name: rag-vector-db
    networks:
      - rag-network
    ports:
      - "8005:8005"
    volumes:
      - chromadb-data:/chroma/chroma
      - ./services/vector-db/app:/app
      - ./services/common:/workspace/services/common
    working_dir: /app
    env_file:
      - config.env
    environment:
      - SERVICE_NAME=vector-db
      - SERVICE_PORT=8005
      - COLLECTION_NAME=markdown_vault
      - CHROMA_DB_PATH=/chroma/chroma
      - PYTHONPATH=/workspace
      - PYTHONUNBUFFERED=1
    command: bash -c "pip install -q chromadb flask flask-cors requests && python -u service.py"
    restart: unless-stopped

  # Embedding Service (standalone Python)
  embedding-service:
    image: python:3.11-slim
    container_name: rag-embedding-service
    networks:
      - rag-network
    ports:
      - "8006:8006"
    volumes:
      - ./services/embedding/app:/app
      - ./services/common:/workspace/services/common
    working_dir: /app
    env_file:
      - config.env
    environment:
      - SERVICE_NAME=embedding-service
      - SERVICE_PORT=8006
      - PYTHONPATH=/workspace
      - PYTHONUNBUFFERED=1
    command: bash -c "pip install -q flask flask-cors requests && python -u service.py"
    restart: unless-stopped

  # Search Service (standalone Python)
  search-service:
    image: python:3.11-slim
    container_name: rag-search-service
    networks:
      - rag-network
    ports:
      - "8002:8002"
    volumes:
      - ./services/search/app:/app
      - ./services/common:/workspace/services/common
      - ./src:/workspace/src
      - bm25-indices:/indices       # BM25 index persistence
      - uploads:/uploads             # Access to uploaded documents
    working_dir: /app
    env_file:
      - config.env
    environment:
      - SERVICE_NAME=search-service
      - SERVICE_PORT=8002
      - PYTHONPATH=/workspace
      - PYTHONUNBUFFERED=1
    command: bash -c "pip install -q flask flask-cors requests rank-bm25 && python -u service.py"
    depends_on:
      - vector-db
      - embedding-service
      - knowledge-graph
      - reranker
    restart: unless-stopped

  # Chat Service (standalone Python)
  chat-service:
    image: python:3.11-slim
    container_name: rag-chat-service
    networks:
      - rag-network
    ports:
      - "8003:8003"
    volumes:
      - ./services/chat/app:/app
      - ./services/common:/workspace/services/common
    working_dir: /app
    environment:
      - SERVICE_NAME=chat-service
      - SERVICE_PORT=8003
      - SEARCH_SERVICE_URL=http://search-service:8002
      - LLM_SERVICE_URL=http://host.docker.internal:11434
      - CHAT_MODEL=llama3.2:3b
      - PYTHONPATH=/workspace
    command: bash -c "pip install -q flask flask-cors requests && python -u service.py"
    depends_on:
      - search-service

  # API Gateway (standalone Python)
  api-gateway:
    image: python:3.11-slim
    container_name: rag-api-gateway
    networks:
      - rag-network
    ports:
      - "8000:8000"
    volumes:
      - ./services/api-gateway/app:/app
      - ./services/common:/workspace/services/common
      - ./config:/workspace/config
    working_dir: /app
    environment:
      - SERVICE_NAME=api-gateway
      - SERVICE_PORT=8000
      - SEARCH_SERVICE_URL=http://search-service:8002
      - CHAT_SERVICE_URL=http://chat-service:8003
      - VECTOR_DB_URL=http://vector-db:8005
      - EMBEDDING_SERVICE_URL=http://embedding-service:8006
      - PYTHONPATH=/workspace
    command: bash -c "pip install -q flask flask-cors requests && python -u service.py"
    depends_on:
      - search-service
      - chat-service
      - vector-db

  # Docling Service (PDF Processing)
  docling-service:
    image: python:3.11-slim
    container_name: rag-docling-service
    networks:
      - rag-network
    ports:
      - "8004:8004"
    volumes:
      - ./services/docling/app:/app
      - ./services/common:/workspace/services/common
      - uploads:/uploads
    working_dir: /app
    environment:
      - SERVICE_NAME=docling-service
      - SERVICE_PORT=8004
      - PYTHONPATH=/workspace
    command: bash -c "apt-get update -qq && apt-get install -y -qq poppler-utils tesseract-ocr && pip install -q flask flask-cors requests docling && python -u service.py"

  # Ingest Service (Document Ingestion)
  ingest-service:
    image: python:3.11-slim
    container_name: rag-ingest-service
    networks:
      - rag-network
    ports:
      - "8001:8001"
    volumes:
      - ./services/ingest/app:/app
      - ./services/common:/workspace/services/common
      - ./src:/workspace/src
      - uploads:/uploads
      - bm25-indices:/indices         # BM25 indices (shared with search)
      - knowledge-graph:/kg-data       # KG data (shared with KG service)
    working_dir: /app
    environment:
      - SERVICE_NAME=ingest-service
      - SERVICE_PORT=8001
      - DOCLING_SERVICE_URL=http://docling-service:8004
      - EMBEDDING_SERVICE_URL=http://embedding-service:8006
      - VECTOR_DB_URL=http://vector-db:8005
      - PYTHONPATH=/workspace
      - UPLOAD_FOLDER=/uploads
    command: bash -c "pip install -q flask flask-cors requests chromadb ollama pyyaml && python -u service.py"
    depends_on:
      - docling-service
      - embedding-service
      - vector-db

  # Knowledge Graph Service
  knowledge-graph:
    image: python:3.11-slim
    container_name: rag-knowledge-graph
    networks:
      - rag-network
    ports:
      - "8007:8007"
    volumes:
      - ./services/knowledge-graph/app:/app
      - ./services/common:/workspace/services/common
      - ./src:/workspace/src
      - knowledge-graph:/kg-data         # Knowledge graph persistence
      - bm25-indices:/indices            # BM25 indices (shared)
    working_dir: /app
    environment:
      - SERVICE_NAME=knowledge-graph
      - SERVICE_PORT=8007
      - VECTOR_DB_URL=http://vector-db:8005
      - KNOWLEDGE_GRAPH_PATH=/kg-data/knowledge_graph.pkl
      - PYTHONPATH=/workspace
    command: bash -c "pip install -q flask flask-cors requests networkx chromadb && python -u service.py"
    depends_on:
      - vector-db

  # Re-ranking Service (optional, adds latency but improves precision)
  reranker:
    image: python:3.11-slim
    container_name: rag-reranker
    networks:
      - rag-network
    ports:
      - "8008:8008"
    volumes:
      - ./services/reranker/app:/app
      - ./services/common:/workspace/services/common
      - ./src:/workspace/src
    working_dir: /app
    environment:
      - SERVICE_NAME=reranker-service
      - SERVICE_PORT=8008
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - CHAT_MODEL=llama3.2:3b
      - PYTHONPATH=/workspace
    command: bash -c "pip install -q flask flask-cors requests && python -u service.py"

  # Playwright Testing Service
  playwright-tests:
    image: mcr.microsoft.com/playwright/python:v1.55.0-jammy
    container_name: rag-playwright-tests
    networks:
      - rag-network
    volumes:
      - ./tests:/tests
      - ./test-results:/test-results
      - ./screenshots:/screenshots
    working_dir: /tests
    environment:
      - BASE_URL=http://frontend:80
      - PYTHONUNBUFFERED=1
    command: bash -c "pip install -q pytest pytest-playwright && python -m pytest test_ui_playwright.py -v -s --tb=short"
    depends_on:
      - frontend
      - web-api

  # SearXNG Web Search Service
  searxng:
    image: searxng/searxng:latest
    container_name: rag-searxng
    networks:
      - rag-network
    ports:
      - "8080:8080"
    volumes:
      - ./config/searxng:/etc/searxng:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
    restart: unless-stopped

  # Web Search Service (wrapper for SearXNG)
  web-search:
    image: python:3.11-slim
    container_name: rag-web-search
    networks:
      - rag-network
    ports:
      - "8009:8009"
    volumes:
      - ./services/web-search/app:/app
      - ./services/common:/workspace/services/common
    working_dir: /app
    environment:
      - SERVICE_NAME=web-search
      - SERVICE_PORT=8009
      - SEARXNG_URL=http://searxng:8080
      - PYTHONPATH=/workspace
    command: bash -c "pip install -q flask flask-cors requests && python -u service.py"
    depends_on:
      - searxng

  # React Frontend (production build with Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rag-frontend
    networks:
      - rag-network
    ports:
      - "3000:80"
    depends_on:
      - web-api
    restart: unless-stopped

  # Metrics Storage Service (SQLite)
  metrics-store:
    image: python:3.11-slim
    container_name: rag-metrics-store
    networks:
      - rag-network
    ports:
      - "8011:8011"
    volumes:
      - metrics-data:/data/metrics
      - ./services/metrics-store/app:/app
      - ./services/common:/workspace/services/common
      - /var/run/docker.sock:/var/run/docker.sock:ro  # Read-only Docker socket for stats
    working_dir: /app
    environment:
      - SERVICE_NAME=metrics-store
      - SERVICE_PORT=8011
      - METRICS_DB_PATH=/data/metrics/metrics.db
      - PYTHONPATH=/workspace
    command: bash -c "apt-get update -qq && apt-get install -y -qq docker.io && pip install -q flask flask-cors psutil && python -u service.py"
    restart: unless-stopped

  # Flask API Server (API-only backend)
  web-api:
    image: python:3.11-slim
    container_name: rag-web-api
    networks:
      - rag-network
    ports:
      - "5555:5555"
    volumes:
      - ./src:/app
      - ./config:/workspace/config
    working_dir: /app
    environment:
      - PORT=5555
      - PYTHONPATH=/workspace
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - VECTOR_DB_URL=http://vector-db:8005
      - SEARCH_SERVICE_URL=http://search-service:8002
      - INGEST_SERVICE_URL=http://ingest-service:8001
      - KNOWLEDGE_GRAPH_URL=http://knowledge-graph:8007
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: bash -c "pip install -q flask flask-cors requests && python api_server.py"
    depends_on:
      - vector-db
      - search-service
      - ingest-service
      - knowledge-graph

