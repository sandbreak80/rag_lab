# Main Server Configuration
# Production Nginx - Standalone Container

server {
    listen 80;
    server_name _;  # Accept all hostnames

    root /usr/share/nginx/html;
    index index.html;

    # ============================================================
    # SECURITY HEADERS
    # ============================================================

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' http://*:* ws://*:*;" always;

    # ============================================================
    # API GATEWAY (Load Balanced)
    # ============================================================

    location /api/ {
        # Rate limiting
        limit_req zone=api_limit burst=40 nodelay;
        limit_conn conn_limit 20;

        # Proxy to load-balanced API Gateway
        proxy_pass http://api_gateway_backend;
        proxy_http_version 1.1;

        # Connection keep-alive
        proxy_set_header Connection "";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # Upgrade headers for WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;

        # Performance
        proxy_buffering off;
        proxy_request_buffering off;

        # Timeouts for long-running LLM requests
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Error handling
        proxy_intercept_errors on;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    # ============================================================
    # AUTH SERVICE (Direct for low latency)
    # ============================================================

    location /api/auth/ {
        # Stricter rate limiting for auth
        limit_req zone=auth_limit burst=10 nodelay;

        # Rewrite to remove /api/auth prefix
        rewrite ^/api/auth/(.*) /$1 break;

        # Proxy to auth service
        proxy_pass http://auth_service;
        proxy_http_version 1.1;

        # Standard headers
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Shorter timeouts for auth
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ============================================================
    # HEALTH CHECK
    # ============================================================

    location /health {
        # No rate limiting for health checks
        access_log off;

        # Check API Gateway
        proxy_pass http://api_gateway_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    # ============================================================
    # METRICS (Optional - restrict in production)
    # ============================================================

    location /metrics {
        # Uncomment to restrict to internal IPs only
        # allow 10.0.0.0/8;
        # allow 172.16.0.0/12;
        # allow 192.168.0.0/16;
        # allow 127.0.0.1;
        # deny all;

        proxy_pass http://api_gateway_backend/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ============================================================
    # FRONTEND STATIC FILES (React SPA)
    # ============================================================

    location / {
        # General rate limiting
        limit_req zone=general_limit burst=100 nodelay;

        # Try to serve file, fallback to index.html for SPA routing
        try_files $uri $uri/ /index.html;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ============================================================
    # STATIC ASSETS (Aggressive caching)
    # ============================================================

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;

        # Enable pre-compressed gzip if available
        gzip_static on;
    }

    # ============================================================
    # INDEX.HTML (No caching)
    # ============================================================

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ============================================================
    # SECURITY: Block common attacks
    # ============================================================

    # Block access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block access to backup files
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ============================================================
    # ERROR PAGES
    # ============================================================

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

