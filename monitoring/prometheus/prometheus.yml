    metrics_path: '/metrics'

  # Metrics Store
  - job_name: 'metrics-store'
    scrape_interval: 15s
    static_configs:
      - targets: ['metrics-store:8011']
        labels:
          service: 'metrics-store'
          type: 'application'
    metrics_path: '/metrics'

  # Security Guardrails
  - job_name: 'security-guardrails'
    scrape_interval: 15s
    static_configs:
      - targets: ['security-guardrails:8013']
        labels:
          service: 'security-guardrails'
          type: 'application'
    metrics_path: '/metrics'

  # Auth Service
  - job_name: 'auth-service'
    scrape_interval: 15s
    static_configs:
      - targets: ['auth-service:8014']
        labels:
          service: 'auth-service'
